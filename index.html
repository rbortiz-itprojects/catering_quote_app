<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custo &amp; Corte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EDE7D8;
    --paper-card:#F7F3E7;
    --ink:#232920;
    --ink-soft:#5B5A4C;
    --accent:#B9812A;      /* mustard / spice */
    --accent-dark:#8C6420;
    --herb:#4C6B48;        /* olive-herb green */
    --herb-dark:#374F34;
    --brick:#A24A30;       /* warning / delete */
    --line:#CFC6AC;
    --line-soft:#DED6BE;
    --white:#FFFDF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  #app{min-height:100vh;display:flex;}
  ::selection{background:var(--accent);color:var(--white);}

  /* ---------- layout ---------- */
  .sidebar{
    width:220px;flex-shrink:0;
    background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;
    padding:28px 0 20px;
  }
  .brand{
    font-family:'Fraunces',serif;font-weight:700;font-size:22px;
    padding:0 22px 22px;border-bottom:1px solid rgba(255,255,255,0.12);
    line-height:1.15;
  }
  .brand span{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:6px;}
  .nav{margin-top:18px;display:flex;flex-direction:column;}
  .nav-item{
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;
    padding:13px 22px;cursor:pointer;color:rgba(247,243,231,0.65);
    border-left:3px solid transparent;transition:all .15s ease;
    display:flex;justify-content:space-between;
  }
  .nav-item:hover{color:var(--paper);background:rgba(255,255,255,0.04);}
  .nav-item.active{color:var(--white);border-left-color:var(--accent);background:rgba(255,255,255,0.06);}
  .nav-item .count{color:rgba(255,255,255,0.35);}
  .nav-footer{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,0.12);}
  .nav-footer button{
    width:100%;background:none;border:1px solid rgba(255,255,255,0.25);color:rgba(247,243,231,0.75);
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px;border-radius:3px;cursor:pointer;margin-top:8px;
    letter-spacing:.03em;
  }
  .nav-footer button:hover{border-color:var(--accent);color:var(--white);}

  .main{flex:1;padding:36px 44px;max-width:1180px;}
  h1.page-title{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin:0 0 4px;}
  .page-sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}

  /* ---------- ledger table ---------- */
  table.ledger{width:100%;border-collapse:collapse;background:var(--paper-card);border:1px solid var(--line);}
  table.ledger thead th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);padding:10px 14px;border-bottom:1px solid var(--line);background:#E8E1CD;
  }
  table.ledger tbody td{padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle;}
  table.ledger tbody tr:last-child td{border-bottom:none;}
  table.ledger tbody tr:hover{background:#F1ECDD;}
  table.ledger input, table.ledger select{
    font-family:inherit;font-size:14px;border:1px solid transparent;background:transparent;
    padding:4px 6px;border-radius:3px;width:100%;color:var(--ink);
  }
  table.ledger input:hover, table.ledger select:hover{border-color:var(--line);}
  table.ledger input:focus, table.ledger select:focus{outline:none;border-color:var(--accent);background:var(--white);}
  .num{font-family:'IBM Plex Mono',monospace;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .icon-btn{
    background:none;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink-soft);padding:4px 8px;border-radius:3px;
  }
  .icon-btn:hover{background:rgba(162,74,48,0.1);color:var(--brick);}
  .icon-btn.add{color:var(--herb-dark);}
  .icon-btn.add:hover{background:rgba(76,107,72,0.12);}

  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.02em;
    background:var(--herb);color:var(--white);border:none;padding:9px 16px;border-radius:4px;cursor:pointer;
  }
  .btn:hover{background:var(--herb-dark);}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink-soft);}
  .btn.ghost{background:transparent;color:var(--accent-dark);border:1px dashed var(--accent);}
  .btn.ghost:hover{background:rgba(185,129,42,0.08);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;}
  .search{
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 12px;border:1px solid var(--line);
    border-radius:4px;background:var(--white);width:240px;
  }

  /* ---------- dish cards ---------- */
  .dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .dish-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer;
    transition:border-color .15s, transform .1s;position:relative;
  }
  .dish-card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .dish-card h3{font-family:'Fraunces',serif;font-size:17px;margin:0 0 10px;font-weight:600;line-height:1.25;}
  .dish-card .meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .dish-card .meta b{color:var(--herb-dark);}
  .dish-card .del{
    position:absolute;top:10px;right:10px;background:none;border:none;color:var(--ink-soft);
    font-size:13px;cursor:pointer;opacity:0;transition:opacity .15s;
  }
  .dish-card:hover .del{opacity:1;}
  .dish-card .del:hover{color:var(--brick);}

  .new-dish-card{
    display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:6px;
    min-height:88px;cursor:pointer;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  .new-dish-card:hover{border-color:var(--accent);color:var(--accent-dark);}

  /* ---------- dish editor ---------- */
  .editor-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .back{cursor:pointer;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .back:hover{color:var(--accent-dark);}
  .dish-name-input{
    font-family:'Fraunces',serif;font-size:26px;font-weight:600;border:none;background:transparent;
    border-bottom:1px solid transparent;padding:2px 0;flex:1;color:var(--ink);
  }
  .dish-name-input:hover{border-bottom-color:var(--line);}
  .dish-name-input:focus{outline:none;border-bottom-color:var(--accent);}

  .editor-grid{display:grid;grid-template-columns:1fr 280px;gap:28px;align-items:start;}

  .field-row{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .field input{
    font-family:'IBM Plex Mono',monospace;font-size:14px;border:1px solid var(--line);border-radius:4px;
    padding:7px 10px;background:var(--white);width:130px;
  }
  .field input:focus{outline:none;border-color:var(--accent);}

  /* ---------- receipt tape (signature element) ---------- */
  .tape{
    background:var(--white);
    border:1px solid var(--line);
    position:relative;
    font-family:'IBM Plex Mono',monospace;
    padding:22px 20px 20px;
    box-shadow:0 6px 18px rgba(35,41,32,0.08);
  }
  .tape::before{
    content:"";position:absolute;top:-9px;left:0;right:0;height:9px;
    background:
      radial-gradient(circle at 8px 9px, transparent 5px, var(--paper) 5.5px) repeat-x;
    background-size:16px 9px;
  }
  .tape::after{
    content:"";position:absolute;bottom:-9px;left:0;right:0;height:9px;
    background:
      radial-gradient(circle at 8px 0px, transparent 5px, var(--paper) 5.5px) repeat-x;
    background-size:16px 9px;
  }
  .tape h4{
    margin:0 0 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-soft);text-align:center;border-bottom:1px dashed var(--line);padding-bottom:10px;
  }
  .tape-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink);}
  .tape-row.dim{color:var(--ink-soft);font-size:12px;}
  .tape-divider{border:none;border-top:1px dashed var(--line);margin:10px 0;}
  .tape-row.total{font-size:16px;font-weight:600;color:var(--herb-dark);padding-top:8px;}
  .tape-row.sale{font-size:16px;font-weight:600;color:var(--accent-dark);}
  .tape-row.person{font-size:14px;}
  .tape-note{font-size:10.5px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.5;}
  .warn-badge{display:inline-block;background:var(--brick);color:var(--white);font-size:9.5px;padding:1px 5px;border-radius:3px;margin-left:6px;letter-spacing:.03em;}

  /* ---------- import modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(35,41,32,0.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--paper-card);border-radius:8px;padding:26px;width:560px;max-width:92vw;max-height:84vh;overflow:auto;border:1px solid var(--line);}
  .modal h3{font-family:'Fraunces',serif;margin:0 0 6px;font-size:20px;}
  .modal p{color:var(--ink-soft);font-size:13px;margin:0 0 14px;line-height:1.5;}
  .modal textarea{
    width:100%;height:220px;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px;
    border:1px solid var(--line);border-radius:5px;background:var(--white);resize:vertical;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .modal-msg{font-size:12.5px;margin-top:10px;font-family:'IBM Plex Mono',monospace;}
  .modal-msg.err{color:var(--brick);}
  .modal-msg.ok{color:var(--herb-dark);}

  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);margin-bottom:6px;}

  select.unit-select{-webkit-appearance:none;appearance:none;cursor:pointer;}
  a.plain{color:inherit;text-decoration:none;}

  @media (max-width: 760px){
    #app{flex-direction:column;}
    .sidebar{width:100%;padding:14px 0 10px;}
    .brand{padding:0 16px 12px;}
    .nav{flex-direction:row;margin-top:6px;}
    .nav-item{flex:1;padding:10px 16px;border-left:none;border-bottom:3px solid transparent;}
    .nav-item.active{border-bottom-color:var(--accent);}
    .nav-footer{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;}
    .nav-footer #save-status{width:100%;}
    .nav-footer button{width:auto;flex:1;margin-top:0;}
    .main{padding:20px 14px;}
    .editor-grid{grid-template-columns:1fr;}
    table.ledger{display:block;overflow-x:auto;}
    .search{width:100%;}
    .toolbar{flex-wrap:wrap;}
  }
</style>


</head>

      else { seedFromBackup(); await persist(true); }
      state.saveStatus = CONFIGURED ? "Synced" : "Saved on this device only";
    }catch(e){
      console.error(e);
      state.saveStatus = "Could not load: "+e.message;
      if(!state.products.length) seedFromBackup();
    }
    state.loaded = true;
    render();
  }

  function seedFromBackup(){
    state.products = SEED.products.map(p=>({...p}));
    state.dishes = SEED.dishes.map(d=>({...d, items:d.items.map(i=>({...i}))}));
    state.nextProdId = SEED.nextProdId;
    state.nextDishId = SEED.nextDishId;
  }

  async function persist(silent){
    const payload = currentPayload();
    state.saveTimer = null;
    try{
      if(CONFIGURED) await remoteSave(payload);
      else localStorage.setItem(LOCAL_KEY, JSON.stringify(payload));
      state.saveStatus = CONFIGURED ? "Synced" : "Saved on this device only";
    }catch(e){
      console.error("Save failed", e);
      state.saveStatus = "NOT saved: "+e.message;
    }
    if(!silent) renderSaveIndicator();
  }

  function queueSave(){
    state.saveStatus = "Saving…";
    renderSaveIndicator();
    if(state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(()=>persist(false), 500);
  }

  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState!=="visible" || !CONFIGURED || !state.session || !state.loaded) return;
    if(state.saveTimer) return;
    try{
      const data = await remoteLoad();
      if(data){ applyPayload(data); render(); }
    }catch(e){ console.error(e); }
  });

  // ---------------------------------------------------------------------
  // Unit conversion & cost math
  // ---------------------------------------------------------------------
  function convert(qty, fromUnit, toUnit){
    if(fromUnit === toUnit) return qty;
    const weight = {kg:1, g:1/1000};
    const vol = {l:1, ml:1/1000};
    if(weight[fromUnit] !== undefined && weight[toUnit] !== undefined){
      return qty * weight[fromUnit] / weight[toUnit];
    }
    if(vol[fromUnit] !== undefined && vol[toUnit] !== undefined){
      return qty * vol[fromUnit] / vol[toUnit];
    }
    return null; // incompatible units
  }

  function itemCost(item, product){
    if(!product) return {cost:0, mismatch:true};
    const converted = convert(item.qty, item.unit, product.unit);
    if(converted === null) return {cost:0, mismatch:true};
    return {cost: converted * product.price, mismatch:false};
  }

  function itemWeightKg(item){
    if(item.unit === "kg") return item.qty;
    if(item.unit === "g") return item.qty/1000;
    if(item.unit === "l") return item.qty;   // approx 1L ~ 1kg
    if(item.unit === "ml") return item.qty/1000;
    return 0;
  }

  function dishTotals(dish){
    let cost=0, weight=0, mismatches=0;
    dish.items.forEach(it=>{
      const p = state.products.find(pr=>pr.id===it.productId);
      const r = itemCost(it, p);
      cost += r.cost;
      if(r.mismatch) mismatches++;
      weight += itemWeightKg(it);
    });
    const gpp = dish.gramsPerPerson || 300;
    const computedPeople = weight>0 ? Math.round((weight*1000)/gpp) : 0;
    const people = (dish.numPeople && dish.numPeople>0) ? dish.numPeople : computedPeople;
    const sale = cost*3;
    return {
      cost, weight, mismatches, computedPeople, people,
      costPerPerson: people>0 ? cost/people : null,
      salePerPerson: people>0 ? sale/people : null,
      sale, gpp
    };
  }

  function fmtMoney(n){
    if(n===null || n===undefined || isNaN(n)) return "—";
    return "R$ " + n.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtKg(n){
    return n.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:3}) + " kg";
  }

  // ---------------------------------------------------------------------
  // Mutations
  // ---------------------------------------------------------------------
  function addProduct(){
    const id = state.nextProdId++;
    state.products.push({id, name:"Novo ingrediente", unit:"kg", price:0});
    queueSave(); render();
    setTimeout(()=>{
      const el = document.querySelector(`[data-prod-name="${id}"]`);
      if(el){ el.focus(); el.select(); }
    },0);
  }
  function updateProduct(id, field, value){
    const p = state.products.find(x=>x.id===id);
    if(!p) return;
    if(field==="price") p[field] = parseFloat(value)||0;
    else p[field] = value;
    queueSave();
  }
  function deleteProduct(id){
    const used = state.dishes.some(d=>d.items.some(i=>i.productId===id));
    if(used && !confirm("This ingredient is used in at least one recipe. Delete anyway? The recipe items will show as missing.")) return;
    state.products = state.products.filter(x=>x.id!==id);
    queueSave(); render();
  }

  function addDish(){
    const id = state.nextDishId++;
    state.dishes.push({id, name:"New dish", items:[], numPeople:0, gramsPerPerson:300});
    queueSave();
    state.view.tab="dishes"; state.view.dishId=id;
    render();
  }
  function deleteDish(id, ev){
    if(ev) ev.stopPropagation();
    if(!confirm("Delete this recipe?")) return;
    state.dishes = state.dishes.filter(d=>d.id!==id);
    if(state.view.dishId===id) state.view.dishId=null;
    queueSave(); render();
  }
  function updateDish(id, field, value){
    const d = state.dishes.find(x=>x.id===id);
    if(!d) return;
    if(field==="gramsPerPerson" || field==="numPeople") d[field] = parseFloat(value)||0;
    else d[field] = value;
    queueSave(); render();
  }
  function addItemToDish(dishId){
    const d = state.dishes.find(x=>x.id===dishId);
    if(!d) return;
    const firstProd = state.products[0];
    d.items.push({productId: firstProd? firstProd.id : null, qty:1, unit: firstProd? firstProd.unit : "unit"});
    queueSave(); render();
  }
  function updateItem(dishId, idx, field, value){
    const d = state.dishes.find(x=>x.id===dishId);
    if(!d) return;
    const it = d.items[idx];
    if(field==="qty") it.qty = parseFloat(value)||0;
    else if(field==="productId") it.productId = parseInt(value);
    else it.unit = value;
    queueSave(); render();
  }
  function removeItem(dishId, idx){
    const d = state.dishes.find(x=>x.id===dishId);
    if(!d) return;
    d.items.splice(idx,1);
    queueSave(); render();
  }

  function doImport(){
    state.importMsg=null;
    let data;
    try{ data = JSON.parse(state.importText); }
    catch(e){ state.importMsg={type:"err", text:"Couldn't parse JSON: "+e.message}; render(); return; }

    if(state.importReplace){
      if(!Array.isArray(data.products) || !Array.isArray(data.dishes)){
        state.importMsg={type:"err", text:"To replace everything, the file needs both 'products' and 'dishes'."}; render(); return;
      }
      if(!confirm("Replace ALL current ingredients and recipes with the contents of this file?")) return;
      applyPayload({
        products: data.products, dishes: data.dishes,
        nextProdId: data.nextProdId || (Math.max(0,...data.products.map(p=>p.id))+1),
        nextDishId: data.nextDishId || (Math.max(0,...data.dishes.map(d=>d.id))+1)
      });
      state.importMsg={type:"ok", text:`Replaced everything: ${data.products.length} ingredients, ${data.dishes.length} recipes.`};
      queueSave(); render(); return;
    }
    let addedProducts=0, addedDishes=0, updatedProducts=0;

    if(Array.isArray(data.products)){
      data.products.forEach(p=>{
        const existing = state.products.find(x=> x.name.trim().toLowerCase()===String(p.name).trim().toLowerCase() && x.unit===p.unit);
        if(existing){
          existing.price = p.price;
          updatedProducts++;
        } else {
          state.products.push({id: state.nextProdId++, name:p.name, unit:p.unit||"unit", price:parseFloat(p.price)||0});
          addedProducts++;
        }
      });
    }
    if(Array.isArray(data.dishes)){
      data.dishes.forEach(d=>{
        state.dishes.push({
          id: state.nextDishId++,
          name: d.name || "Imported dish",
          items: (d.items||[]).map(i=>({productId:i.productId, qty:parseFloat(i.qty)||0, unit:i.unit||"unit"})),
          numPeople: d.numPeople||0,
          gramsPerPerson: d.gramsPerPerson||300
        });
        addedDishes++;
      });
    }
    if(addedProducts===0 && addedDishes===0 && updatedProducts===0){
      state.importMsg={type:"err", text:"No recognizable 'products' or 'dishes' arrays found in that JSON."};
      render(); return;
    }
    state.importMsg={type:"ok", text:`Imported: ${addedProducts} new ingredient(s), ${updatedProducts} price update(s), ${addedDishes} new recipe(s).`};
    queueSave();
    render();
  }

  function exportData(){
    const payload = JSON.stringify({products:state.products, dishes:state.dishes, nextProdId:state.nextProdId, nextDishId:state.nextDishId}, null, 2);
    const blob = new Blob([payload], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "catering-data-export.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Render

  const root = document.getElementById("app");

    }
    if(!state.loaded){
      root.innerHTML = `<div style="padding:60px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft)">Loading ledger…</div>`;
      return;
    }
    root.innerHTML = `

        <div class="nav">
          <div class="nav-item ${state.view.tab==='dishes'?'active':''}" data-nav="dishes">Recipes <span class="count">${state.dishes.length}</span></div>

    `;
    bindEvents();
  }

              <td class="mono" style="color:var(--ink-soft);font-size:12.5px;">${usedCount} recipe${usedCount===1?'':'s'}</td>
              <td><button class="icon-btn" data-del-prod="${p.id}">✕</button></td>
            </tr>`;
          }).join("") : `<tr><td colspan="5"><div class="empty-state">No ingredients match.</div></td></tr>`}
        </tbody>

    `;
  }

  function renderDishList(){
    const q = state.view.dishSearch.toLowerCase();
    const list = state.dishes.filter(d=>d.name.toLowerCase().includes(q));
    return `
      <h1 class="page-title">Recipes</h1>

      <div class="toolbar">
        <input class="search" placeholder="Search recipes…" value="${escapeAttr(state.view.dishSearch)}" data-input="dishSearch">

      </div>
      <div class="dish-grid">
        ${list.map(d=>{

          return `
          <div class="dish-card" data-open-dish="${d.id}">

            <div class="meta"><span>${d.items.length} item${d.items.length===1?'':'s'}</span><b>${fmtMoney(t.cost)}</b></div>

        }).join("")}
        <div class="new-dish-card" data-action="add-dish">+ New recipe</div>
      </div>
    `;
  }

  function renderDishEditor(){
    const d = state.dishes.find(x=>x.id===state.view.dishId);
    if(!d){ state.view.dishId=null; return renderDishList(); }
    const t = dishTotals(d);
    return `
      <div class="editor-header">
        <span class="back" data-action="back-to-dishes">← Recipes</span>

  function renderLogin(){

  function renderSaveIndicator(){
    const el = document.getElementById("save-status");
    if(el) el.textContent = state.saveStatus;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // ---------------------------------------------------------------------
  // Event binding (delegation-lite: re-bind after each render)
  // ---------------------------------------------------------------------
  function bindEvents(){
    root.querySelectorAll('[data-nav]').forEach(el=>{
      el.onclick = ()=>{ state.view.tab = el.dataset.nav; state.view.dishId=null; render(); };
    });
    const addProdBtn = root.querySelector('[data-action="add-product"]');
    if(addProdBtn) addProdBtn.onclick = addProduct;

    root.querySelectorAll('[data-del-prod]').forEach(el=>{
      el.onclick = ()=> deleteProduct(parseInt(el.dataset.delProd));
    });
    root.querySelectorAll('[data-prod]').forEach(el=>{
      const id = parseInt(el.dataset.prod), field = el.dataset.field;
      el.onchange = ()=> updateProduct(id, field, el.value);
      if(el.tagName==='INPUT') el.oninput = ()=> updateProduct(id, field, el.value);
    });
    const prodSearch = root.querySelector('[data-input="prodSearch"]');
    if(prodSearch){
      prodSearch.oninput = ()=>{ state.view.prodSearch = prodSearch.value; render(); root.querySelector('[data-input="prodSearch"]').focus(); root.querySelector('[data-input="prodSearch"]').setSelectionRange(999,999); };
    }
    const dishSearch = root.querySelector('[data-input="dishSearch"]');
    if(dishSearch){
      dishSearch.oninput = ()=>{ state.view.dishSearch = dishSearch.value; render(); const el2=root.querySelector('[data-input="dishSearch"]'); if(el2){el2.focus(); el2.setSelectionRange(999,999);} };
    }

    root.querySelectorAll('[data-action="add-dish"]').forEach(el=>{ el.onclick = addDish; });
    root.querySelectorAll('[data-open-dish]').forEach(el=>{
      el.onclick = ()=>{ state.view.dishId = parseInt(el.dataset.openDish); render(); };
    });
    root.querySelectorAll('[data-del-dish]').forEach(el=>{
      el.onclick = (ev)=> deleteDish(parseInt(el.dataset.delDish), ev);
    });
    const backBtn = root.querySelector('[data-action="back-to-dishes"]');
    if(backBtn) backBtn.onclick = ()=>{ state.view.dishId=null; render(); };

    root.querySelectorAll('[data-dish-field]').forEach(el=>{
      const id = parseInt(el.dataset.dishId), field = el.dataset.dishField;
      el.onchange = ()=> updateDish(id, field, el.value);
      if(field==='name'){ el.oninput = ()=>{ const d=state.dishes.find(x=>x.id===id); d.name=el.value; queueSave(); }; }
    });

    const addItemBtn = root.querySelector('[data-action="add-item"]');
    if(addItemBtn) addItemBtn.onclick = ()=> addItemToDish(parseInt(addItemBtn.dataset.dishId));

    root.querySelectorAll('[data-item-field]').forEach(el=>{
      const dishId = parseInt(el.dataset.dishId), idx = parseInt(el.dataset.idx), field = el.dataset.itemField;
      el.onchange = ()=> updateItem(dishId, idx, field, el.value);
    });
    root.querySelectorAll('[data-remove-item]').forEach(el=>{
      el.onclick = ()=> removeItem(parseInt(el.dataset.dishId), parseInt(el.dataset.removeItem));
    });

    const importOpenBtn = root.querySelector('[data-action="import"]');
    if(importOpenBtn) importOpenBtn.onclick = ()=>{ state.importOpen=true; state.importMsg=null; render(); };
    const signoutBtn = root.querySelector('[data-action="signout"]');
    if(signoutBtn) signoutBtn.onclick = signOut;
    const exportBtn = root.querySelector('[data-action="export"]');
    if(exportBtn) exportBtn.onclick = exportData;
    const closeImport = root.querySelector('[data-action="close-import"]');
    if(closeImport) closeImport.onclick = ()=>{ state.importOpen=false; render(); };
    const closeImportOverlay = root.querySelector('[data-action="close-import-overlay"]');
    if(closeImportOverlay) closeImportOverlay.onclick = ()=>{ state.importOpen=false; render(); };
    const importTextarea = root.querySelector('[data-input="importText"]');
    if(importTextarea) importTextarea.oninput = ()=>{ state.importText = importTextarea.value; };
    const importFile = root.querySelector('[data-input="importFile"]');
    if(importFile) importFile.onchange = async ()=>{
      const f = importFile.files[0]; if(!f) return;
      state.importText = await f.text(); render();
    };
    const importReplace = root.querySelector('[data-input="importReplace"]');
    if(importReplace) importReplace.onchange = ()=>{ state.importReplace = importReplace.checked; };
    const doImportBtn = root.querySelector('[data-action="do-import"]');
    if(doImportBtn) doImportBtn.onclick = doImport;
  }

  if(CONFIGURED){
    state.session = readSession();
    if(state.session) loadData(); else render();
  } else {
    loadData();
  }
})();
</script>
</body>
</html>
